<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <title>Allocate Tasks - GMB Earn Admin</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0d6efd;
            --primary-light: #0dcaf0;
            --secondary: #6f42c1;
            --success: #198754;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #0d6efd;
            --dark: #212529;
            --light: #f8f9fa;
            --muted: #6c757d;
            --border: #e9ecef;

            --primary-gradient: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            --success-gradient: linear-gradient(135deg, #198754 0%, #20c997 100%);
            --danger-gradient: linear-gradient(135deg, #dc3545 0%, #e74c3c 100%);

            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.15);

            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            color: #2d3748;
            display: flex;
            flex-direction: column;
            padding: 2rem 1rem;
        }

        /* Main Container */
        .page-container {
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .page-title i {
            font-size: 2.5rem;
        }

        .page-subtitle {
            color: var(--muted);
            font-size: 1rem;
            font-weight: 500;
        }

        /* Card */
        .allocation-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        /* Form Section */
        .form-section {
            margin-bottom: 2rem;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .form-label i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 0.5rem;
        }

        /* Input Field */
        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 10px;
            border: 2px solid var(--border);
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all var(--transition-fast);
            background: white;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        /* Info Box */
        .info-box {
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.08) 0%, rgba(13, 202, 240, 0.08) 100%);
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            padding: 1.25rem;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }

        .info-box-title {
            font-weight: 700;
            color: #0d6efd;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .info-box-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            color: #084298;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .info-box-item i {
            margin-top: 0.25rem;
            font-size: 0.85rem;
        }

        .info-box-item:last-child {
            margin-bottom: 0;
        }

        /* Button */
        .btn-allocate {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-allocate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.4);
        }

        .btn-allocate:active {
            transform: translateY(0);
        }

        .btn-allocate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Container */
        .result-container {
            display: none;
            animation: slideInUp 0.4s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success Result */
        .result-success {
            background: linear-gradient(135deg, rgba(25, 135, 84, 0.08) 0%, rgba(32, 201, 151, 0.08) 100%);
            border: 2px solid #198754;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .result-success-icon {
            font-size: 3rem;
            color: #198754;
            margin-bottom: 1rem;
        }

        .result-success-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #155724;
            margin-bottom: 0.75rem;
        }

        .result-success-message {
            color: #0f5132;
            font-weight: 500;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* Result Stats */
        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .result-stat {
            background: white;
            border-radius: 10px;
            padding: 1.25rem;
            text-align: center;
            border: 1px solid rgba(25, 135, 84, 0.2);
        }

        .result-stat-icon {
            font-size: 2rem;
            color: #198754;
            margin-bottom: 0.5rem;
        }

        .result-stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #155724;
            margin-bottom: 0.25rem;
        }

        .result-stat-label {
            font-size: 0.85rem;
            color: #6c757d;
            font-weight: 600;
        }

        /* Error Result */
        .result-error {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.08) 0%, rgba(255, 73, 94, 0.08) 100%);
            border: 2px solid #dc3545;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .result-error-icon {
            font-size: 3rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }

        .result-error-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #842029;
            margin-bottom: 0.75rem;
        }

        .result-error-message {
            color: #721c24;
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* Action Button */
        .action-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 1rem;
            font-family: 'Inter', sans-serif;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2rem;
            }

            .page-subtitle {
                font-size: 0.9rem;
            }

            .allocation-card {
                padding: 1.5rem;
            }

            .result-stats {
                grid-template-columns: 1fr;
            }

            body {
                padding: 1rem 0.5rem;
            }

            .page-container {
                max-width: 100%;
            }

            .form-control {
                padding: 0.875rem 1rem;
                font-size: 1rem;
            }

            .btn-allocate {
                padding: 0.875rem 1rem;
                font-size: 0.95rem;
            }
        }

        /* Loading State */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        .page-footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 2rem;
        }

        .page-footer a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .page-footer a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }
    </style>

    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
    <script>
        (function () {
            var token = document.querySelector('meta[name="csrf-token"]');
            token = token ? token.getAttribute('content') : null;
            var originalFetch = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                var method = (init.method || 'GET').toUpperCase();
                if (token && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                    init.headers = init.headers || {};
                    if (init.headers instanceof Headers) {
                        init.headers.set('X-CSRFToken', token);
                    } else {
                        init.headers['X-CSRFToken'] = token;
                    }
                }
                return originalFetch(input, init);
            };
        })();
    </script>

    <div class="page-container">
        <!-- Header -->
        <div class="page-header">
            <div class="page-title">
                <i class="fas fa-tasks"></i> Allocate Tasks
            </div>
            <p class="page-subtitle">Distribute tasks to users efficiently</p>
        </div>

        <!-- Main Card -->
        <div class="allocation-card">
            <!-- Form -->
            <form id="allocateForm">
                <!-- User Count Input -->
                <div class="form-section">
                    <label class="form-label">
                        <i class="fas fa-users"></i> Number of Users
                    </label>
                    <div class="input-wrapper">
                        <input type="number" id="totalUsers" class="form-control"
                            value="{{ campaign.total_reviews_required }}" readonly required>
                    </div>
                </div>

                <!-- Info Box -->
                <div class="info-box">
                    <div class="info-box-title">
                        <i class="fas fa-info-circle"></i> How It Works
                    </div>
                    <div class="info-box-item">
                        <i class="fas fa-check-circle"></i>
                        <span>Unallocated users receive priority first</span>
                    </div>
                    <div class="info-box-item">
                        <i class="fas fa-check-circle"></i>
                        <span>Each user gets 15–20 randomly selected tasks</span>
                    </div>
                    <div class="info-box-item">
                        <i class="fas fa-check-circle"></i>
                        <span>No user receives duplicate task assignments</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="button" class="btn-allocate" onclick="allocateTasks()" id="allocateBtn">
                    <i class="fas fa-magic"></i> Allocate Tasks
                </button>
            </form>

            <!-- Result Container -->
            <div id="result" class="result-container"></div>
        </div>

        <!-- Footer -->
        <div class="page-footer">
            <p>© 2024-2026 GMB Earn Admin Panel</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function () {
            'use strict';

            window.allocateTasks = function () {
                const totalUsers = document.getElementById('totalUsers').value.trim();
                const allocateBtn = document.getElementById('allocateBtn');
                const resultDiv = document.getElementById('result');

                if (!totalUsers || parseInt(totalUsers) < 1) {
                    resultDiv.innerHTML = `
                        <div class="result-error">
                            <div class="result-error-icon">
                                <i class="fas fa-exclamation-circle"></i>
                            </div>
                            <div class="result-error-title">Input Required</div>
                            <div class="result-error-message">
                                Please enter a valid number of users (minimum 1)
                            </div>
                        </div>
                    `;
                    resultDiv.style.display = 'block';
                    return;
                }

                // Show loading state
                allocateBtn.disabled = true;
                const originalText = allocateBtn.innerHTML;
                allocateBtn.innerHTML = '<span class="loading-spinner"></span> Processing...';

                const campaignId = new URLSearchParams(window.location.search).get('campaign_id') || {{ campaign_id }};
                const formData = new FormData();
                formData.append('total_tasks', totalUsers);

                fetch(`/admin/allocate_tasks/${campaignId}`, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            resultDiv.innerHTML = `
                                <div class="result-success">
                                    <div class="result-success-icon">
                                        <i class="fas fa-check-circle"></i>
                                    </div>
                                    <div class="result-success-title">Tasks Allocated Successfully!</div>
                                    <div class="result-success-message">
                                        ${data.message}
                                    </div>
                                    <button type="button" class="action-button" onclick="location.reload()">
                                        <i class="fas fa-redo"></i> Allocate More
                                    </button>
                                </div>
                            `;
                        } else {
                            resultDiv.innerHTML = `
                                <div class="result-error">
                                    <div class="result-error-icon">
                                        <i class="fas fa-times-circle"></i>
                                    </div>
                                    <div class="result-error-title">Allocation Failed</div>
                                    <div class="result-error-message">
                                        ${data.message || 'An error occurred while allocating tasks'}
                                    </div>
                                    <button type="button" class="action-button" onclick="location.reload()">
                                        <i class="fas fa-redo"></i> Try Again
                                    </button>
                                </div>
                            `;
                        }
                        resultDiv.style.display = 'block';
                    })
                    .catch(error => {
                        resultDiv.innerHTML = `
                            <div class="result-error">
                                <div class="result-error-icon">
                                    <i class="fas fa-network-wired"></i>
                                </div>
                                <div class="result-error-title">Connection Error</div>
                                <div class="result-error-message">
                                    ${error.message || 'Unable to reach the server. Please try again.'}
                                </div>
                                <button type="button" class="action-button" onclick="location.reload()">
                                    <i class="fas fa-redo"></i> Try Again
                                </button>
                            </div>
                        `;
                        resultDiv.style.display = 'block';
                    })
                    .finally(() => {
                        allocateBtn.disabled = false;
                        allocateBtn.innerHTML = originalText;
                    });
            };

            // Allow Enter key to submit
            document.addEventListener('DOMContentLoaded', function () {
                const totalUsers = document.getElementById('totalUsers');
                if (totalUsers) {
                    totalUsers.addEventListener('keypress', function (e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            window.allocateTasks();
                        }
                    });
                }
            });
        })();
    </script>
</body>

</html>
