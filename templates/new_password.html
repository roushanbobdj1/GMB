<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Password - Digital Suvidha</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f172a,#020617);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Card */
.container{
    background:#1e293b;
    padding:25px;
    border-radius:16px;
    width:90%;
    max-width:350px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
    animation:fadeIn 0.8s ease;
}

/* Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Title */
h2{
    text-align:center;
}

.sub{
    text-align:center;
    font-size:13px;
    color:#94a3b8;
}

/* Input */
.input-box{
    margin-top:18px;
    text-align:left;
}

label{
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:10px;
    border:2px solid transparent;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:#22c55e;
}

/* Validation */
.error{border-color:red;}
.success{border-color:#22c55e;}

.msg{
    font-size:12px;
    margin-top:3px;
}

/* Eye icon */
.eye{
    position:absolute;
    right:12px;
    top:38px;
    cursor:pointer;
}

/* Button */
button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#22c55e,#16a34a);
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
}

/* Loader */
.loader{
    display:none;
    border:3px solid #fff;
    border-top:3px solid transparent;
    border-radius:50%;
    width:18px;
    height:18px;
    margin:auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

/* Back */
.back{
    text-align:center;
    margin-top:15px;
    font-size:13px;
}

.back a{
    color:#38bdf8;
    text-decoration:none;
}

</style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
    <script>
        (function () {
            var token = document.querySelector('meta[name="csrf-token"]');
            token = token ? token.getAttribute('content') : null;
            var originalFetch = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                var method = (init.method || 'GET').toUpperCase();
                if (token && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                    init.headers = init.headers || {};
                    if (init.headers instanceof Headers) {
                        init.headers.set('X-CSRFToken', token);
                    } else {
                        init.headers['X-CSRFToken'] = token;
                    }
                }
                return originalFetch(input, init);
            };
        })();
    </script>

<div class="container">
    <h2>Set New Password 🔑</h2>
    <div class="sub">Create a strong password</div>

    <form method="POST" onsubmit="return validateForm()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- PASSWORD -->
        <div class="input-box" style="position:relative;">
            <label>New Password</label>
            <input type="password" id="password" name="password" required onkeyup="checkPassword()">
            <span class="eye" onclick="togglePassword('password')">👁</span>
            <div id="passMsg" class="msg"></div>
        </div>

        <!-- CONFIRM -->
        <div class="input-box" style="position:relative;">
            <label>Confirm Password</label>
            <input type="password" id="confirm" name="confirm" required onkeyup="checkMatch()">
            <span class="eye" onclick="togglePassword('confirm')">👁</span>
            <div id="matchMsg" class="msg"></div>
        </div>

        <button type="submit">
            <span id="btnText">Update Password</span>
            <div class="loader" id="loader"></div>
        </button>

    </form>

    <div class="back">
        <a href="/login">← Back to Login</a>
    </div>
</div>

<script>

// SHOW/HIDE PASSWORD
function togglePassword(id){
    let field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

// PASSWORD STRENGTH
function checkPassword(){
    let pass = document.getElementById("password");
    let msg = document.getElementById("passMsg");

    if(pass.value.length < 6){
        pass.classList.add("error");
        pass.classList.remove("success");
        msg.innerHTML = "Weak password (min 6 chars)";
        msg.style.color = "red";
    } else {
        pass.classList.add("success");
        pass.classList.remove("error");
        msg.innerHTML = "Strong password";
        msg.style.color = "#22c55e";
    }
}

// MATCH CHECK
function checkMatch(){
    let pass = document.getElementById("password").value;
    let confirm = document.getElementById("confirm");
    let msg = document.getElementById("matchMsg");

    if(confirm.value === pass){
        confirm.classList.add("success");
        confirm.classList.remove("error");
        msg.innerHTML = "Password matched";
        msg.style.color = "#22c55e";
    } else {
        confirm.classList.add("error");
        confirm.classList.remove("success");
        msg.innerHTML = "Password not match";
        msg.style.color = "red";
    }
}

// LOADER
function validateForm(){
    let btnText = document.getElementById("btnText");
    let loader = document.getElementById("loader");

    btnText.style.display="none";
    loader.style.display="block";

    return true;
}

</script>

</body>
</html>
