{% extends "base.html" %}

{% block title %}Notifications - GMB Earn{% endblock %}

{% block extra_css %}
<style>
    /* ============================================
       VARIABLES & GENERAL
       ============================================ */
    :root {
        --primary: #0d6efd;
        --primary-light: #0dcaf0;
        --success: #198754;
        --warning: #ffc107;
        --danger: #dc3545;
        --info: #0d6efd;
        --light: #f8f9fa;
        --muted: #6c757d;
        --border: #e9ecef;
        
        --primary-gradient: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
        --success-gradient: linear-gradient(135deg, #198754 0%, #20c997 100%);
        --warning-gradient: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
        --info-gradient: linear-gradient(135deg, #0dcaf0 0%, #00d4ff 100%);
        
        --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.12);
        
        --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================
       PAGE HEADER
       ============================================ */
    .page-header {
        margin-bottom: 2.5rem;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .header-content h1 {
        font-size: 2rem;
        font-weight: 800;
        color: #2d3748;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
        margin: 0 0 0.5rem 0;
    }

    .header-content h1 i {
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .header-content p {
        color: var(--muted);
        font-weight: 500;
        margin: 0;
    }

    .mark-all-btn {
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        border: 2px solid var(--border);
        background: white;
        color: var(--muted);
        font-weight: 700;
        font-size: 0.9rem;
        transition: all var(--transition-base);
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: 'Inter', sans-serif;
    }

    .mark-all-btn:hover {
        background: var(--light);
        color: #2d3748;
        border-color: #dee2e6;
    }

    .header-actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    .clear-all-btn {
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        border: 2px solid var(--danger);
        background: white;
        color: var(--danger);
        font-weight: 700;
        font-size: 0.9rem;
        transition: all var(--transition-base);
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: 'Inter', sans-serif;
    }

    .clear-all-btn:hover {
        background: var(--danger);
        color: white;
    }

    .notif-delete-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 1rem;
        padding: 0.35rem 0.6rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all var(--transition-base);
        flex-shrink: 0;
    }

    .notif-delete-btn:hover {
        background: rgba(220, 53, 69, 0.1);
        color: var(--danger);
    }

    /* ============================================
       NOTIFICATIONS CONTAINER
       ============================================ */
    .notifications-card {
        background: white;
        border-radius: 14px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border);
        overflow: hidden;
    }

    .notifications-body {
        padding: 2rem;
    }

    /* ============================================
       NOTIFICATION ITEMS
       ============================================ */
    .notification-item {
        padding: 1.5rem;
        border-left: 4px solid var(--primary);
        border-radius: 10px;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        margin-bottom: 1.25rem;
        cursor: pointer;
        transition: all var(--transition-base);
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
    }

    .notification-item::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        width: 4px;
        height: 100%;
        background: var(--primary);
        transition: all var(--transition-base);
    }

    .notification-item:hover {
        background: white;
        box-shadow: var(--shadow-md);
        transform: translateX(4px);
    }

    .notification-item.unread {
        background: linear-gradient(135deg, rgba(13, 110, 253, 0.08) 0%, rgba(13, 202, 240, 0.08) 100%);
        border-left-color: var(--primary);
    }

    .notification-item.task::before {
        background: var(--success);
    }

    .notification-item.task {
        border-left-color: var(--success);
    }

    .notification-item.support::before {
        background: var(--warning);
    }

    .notification-item.support {
        border-left-color: var(--warning);
    }

    .notification-item.redeem::before {
        background: var(--info);
    }

    .notification-item.redeem {
        border-left-color: var(--info);
    }

    .notification-item.payment::before {
        background: var(--success);
    }

    .notification-item.payment {
        border-left-color: var(--success);
    }

    .notification-item.alert::before {
        background: var(--danger);
    }

    .notification-item.alert {
        border-left-color: var(--danger);
    }

    .notification-content {
        flex: 1;
    }

    .notification-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.75rem;
    }

    .notification-message {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        color: #2d3748;
        line-height: 1.5;
    }

    .notification-details {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 0.75rem;
        flex-wrap: wrap;
    }

    .notification-time {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }

    .notification-badge {
        display: inline-block;
        padding: 0.4rem 0.875rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .badge-task {
        background: linear-gradient(135deg, rgba(25, 135, 84, 0.12) 0%, rgba(32, 201, 151, 0.12) 100%);
        color: #0f5132;
    }

    .badge-support {
        background: linear-gradient(135deg, rgba(255, 193, 7, 0.12) 0%, rgba(255, 152, 0, 0.12) 100%);
        color: #856404;
    }

    .badge-redeem {
        background: linear-gradient(135deg, rgba(13, 202, 240, 0.12) 0%, rgba(0, 212, 255, 0.12) 100%);
        color: #0d6efd;
    }

    .badge-payment {
        background: linear-gradient(135deg, rgba(25, 135, 84, 0.12) 0%, rgba(32, 201, 151, 0.12) 100%);
        color: #0f5132;
    }

    .badge-alert {
        background: linear-gradient(135deg, rgba(220, 53, 69, 0.12) 0%, rgba(255, 73, 94, 0.12) 100%);
        color: #842029;
    }

    .unread-indicator {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary);
        flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(13, 110, 253, 0.3);
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0.6;
        }
    }

    /* ============================================
       EMPTY STATE
       ============================================ */
    .empty-state {
        text-align: center;
        padding: 4rem 2rem;
    }

    .empty-state-icon {
        font-size: 3.5rem;
        color: var(--muted);
        margin-bottom: 1.5rem;
        opacity: 0.3;
    }

    .empty-state-title {
        font-size: 1.3rem;
        font-weight: 800;
        color: #2d3748;
        margin-bottom: 0.75rem;
    }

    .empty-state-text {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.95rem;
        margin: 0;
    }

    /* ============================================
       FILTERS & ACTIONS
       ============================================ */
    .notification-filters {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 0.65rem 1.25rem;
        border-radius: 8px;
        border: 2px solid var(--border);
        background: white;
        color: var(--muted);
        font-weight: 700;
        font-size: 0.85rem;
        transition: all var(--transition-base);
        cursor: pointer;
        text-decoration: none;
        font-family: 'Inter', sans-serif;
    }

    .filter-btn:hover,
    .filter-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 992px) {
        .header-content h1 {
            font-size: 1.5rem;
        }

        .header-top {
            flex-direction: column;
            align-items: flex-start;
        }

        .mark-all-btn {
            width: 100%;
            justify-content: center;
        }
    }

    @media (max-width: 768px) {
        .page-header {
            margin-bottom: 2rem;
        }

        .header-content h1 {
            font-size: 1.3rem;
        }

        .notifications-body {
            padding: 1.5rem;
        }

        .notification-item {
            padding: 1.25rem;
            flex-direction: column;
        }

        .notification-header {
            flex-direction: column;
            gap: 0.5rem;
        }

        .notification-details {
            gap: 0.75rem;
        }

        .notification-message {
            font-size: 0.9rem;
        }

        .empty-state {
            padding: 2rem 1rem;
        }

        .empty-state-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .notification-filters {
            gap: 0.5rem;
        }

        .filter-btn {
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
        }
    }

    @media (max-width: 576px) {
        .header-content h1 {
            font-size: 1.1rem;
        }

        .notifications-body {
            padding: 1rem;
        }

        .notification-item {
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .notification-message {
            font-size: 0.85rem;
        }

        .notification-time {
            font-size: 0.8rem;
        }

        .notification-badge {
            padding: 0.35rem 0.75rem;
            font-size: 0.7rem;
        }

        .empty-state {
            padding: 1.5rem 1rem;
        }

        .empty-state-title {
            font-size: 1.1rem;
        }

        .empty-state-text {
            font-size: 0.9rem;
        }
    }

    /* Dark Theme Support */
    [data-theme="dark"] .notifications-card {
        background: #2d3748;
        border-color: #4b5563;
    }

    [data-theme="dark"] .header-content h1,
    [data-theme="dark"] .notification-message,
    [data-theme="dark"] .empty-state-title {
        color: #e2e8f0;
    }

    [data-theme="dark"] .header-content p,
    [data-theme="dark"] .notification-time,
    [data-theme="dark"] .empty-state-text {
        color: #a0aec0;
    }

    [data-theme="dark"] .notification-item {
        background: linear-gradient(135deg, #374151 0%, #2d3748 100%);
    }

    [data-theme="dark"] .notification-item:hover {
        background: #374151;
    }

    [data-theme="dark"] .mark-all-btn,
    [data-theme="dark"] .filter-btn {
        background: #374151;
        border-color: #4b5563;
        color: #a0aec0;
    }

    [data-theme="dark"] .mark-all-btn:hover,
    [data-theme="dark"] .filter-btn:hover {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid py-4 py-lg-5">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-top">
            <div class="header-content">
                <h1>
                    <i class="fas fa-bell"></i> Notifications
                </h1>
                <p>Stay updated with your tasks and activities</p>
            </div>
            <div class="header-actions">
                <button class="mark-all-btn" id="markAllRead">
                    <i class="fas fa-check-double"></i> Mark All Read
                </button>
                <button class="clear-all-btn" id="clearAllNotifs">
                    <i class="fas fa-trash-alt"></i> Clear All
                </button>
            </div>
        </div>
    </div>

    <!-- Notifications Card -->
    <div class="notifications-card">
        <div class="notifications-body">
            <!-- Notification Items Container -->
            <div id="notificationsList">
                <!-- Loaded via JavaScript -->
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        document.addEventListener('DOMContentLoaded', function() {
            loadNotifications();

            // Mark all as read
            const markAllBtn = document.getElementById('markAllRead');
            if (markAllBtn) {
                markAllBtn.addEventListener('click', function() {
                    fetch('/api/notifications', {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        const promises = data.notifications
                            .filter(notif => !notif.is_read)
                            .map(notif =>
                                fetch(`/api/notifications/${notif.id}/read`, {
                                    method: 'POST',
                                    headers: {
                                        'X-Requested-With': 'XMLHttpRequest'
                                    }
                                })
                            );
                        
                        Promise.all(promises).then(() => {
                            loadNotifications();
                            if (window.refreshNavBadge) window.refreshNavBadge();
                        });
                    })
                    .catch(error => console.error('Error:', error));
                });
            }

            // ✅ Clear all notifications
            const clearAllBtn = document.getElementById('clearAllNotifs');
            if (clearAllBtn) {
                clearAllBtn.addEventListener('click', function() {
                    if (!confirm('Clear all notifications? This cannot be undone.')) {
                        return;
                    }
                    fetch('/api/notifications/clear', {
                        method: 'POST',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    })
                    .then(response => response.json())
                    .then(() => {
                        loadNotifications();
                        if (window.refreshNavBadge) window.refreshNavBadge();
                    })
                    .catch(error => console.error('Error:', error));
                });
            }
        });

        window.loadNotifications = function() {
            fetch('/api/notifications', {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('notificationsList');
                
                if (!data.notifications || data.notifications.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox empty-state-icon"></i>
                            <h3 class="empty-state-title">No Notifications</h3>
                            <p class="empty-state-text">You're all caught up! Check back later for updates.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                data.notifications.forEach(notif => {
                    const typeClass = notif.type || 'default';
                    const unreadClass = notif.is_read ? '' : 'unread';
                    
                    const item = document.createElement('div');
                    item.className = `notification-item ${typeClass} ${unreadClass}`;
                    
                    const timeAgo = getTimeAgo(notif.created_at);
                    
                    item.innerHTML = `
                        <div class="notification-content">
                            <div class="notification-header">
                                <p class="notification-message">${escapeHtml(notif.message)}</p>
                            </div>
                            <div class="notification-details">
                                <span class="notification-time">
                                    <i class="fas fa-clock"></i> ${timeAgo}
                                </span>
                                <span class="notification-badge badge-${typeClass}">
                                    ${getTypeLabel(typeClass)}
                                </span>
                            </div>
                        </div>
                        ${!notif.is_read ? '<div class="unread-indicator" title="Unread"></div>' : ''}
                        <button type="button" class="notif-delete-btn" title="Delete notification">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    
                    item.addEventListener('click', function() {
                        fetch(`/api/notifications/${notif.id}/read`, {
                            method: 'POST',
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        })
                        .then(() => {
                            loadNotifications();
                            if (window.refreshNavBadge) window.refreshNavBadge();
                        })
                        .catch(error => console.error('Error:', error));
                    });

                    // ✅ Single notification delete (click ko bubble hone se roka
                    // taaki "mark as read" trigger na ho)
                    const deleteBtn = item.querySelector('.notif-delete-btn');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', function(event) {
                            event.stopPropagation();
                            fetch(`/api/notifications/${notif.id}/delete`, {
                                method: 'POST',
                                headers: {
                                    'X-Requested-With': 'XMLHttpRequest'
                                }
                            })
                            .then(() => {
                                loadNotifications();
                                if (window.refreshNavBadge) window.refreshNavBadge();
                            })
                            .catch(error => console.error('Error:', error));
                        });
                    }
                    
                    container.appendChild(item);
                });
            })
            .catch(error => {
                console.error('Error loading notifications:', error);
                const container = document.getElementById('notificationsList');
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle empty-state-icon"></i>
                        <h3 class="empty-state-title">Error Loading Notifications</h3>
                        <p class="empty-state-text">Please refresh the page and try again.</p>
                    </div>
                `;
            });
        };

        function getTypeLabel(type) {
            const labels = {
                'task': 'Task',
                'support': 'Support',
                'redeem': 'Redeem',
                'payment': 'Payment',
                'alert': 'Alert',
                'default': 'Notification'
            };
            return labels[type] || labels['default'];
        }

        function getTimeAgo(dateString) {
            if (!dateString) return 'just now';

            const date = new Date(dateString);
            // ✅ Safety net: agar date parse hi na ho paaye (invalid format),
            // to "NaN ... ago" ki jagah safe fallback dikhao.
            if (isNaN(date.getTime())) return 'just now';

            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            if (seconds < 0) return 'just now';

            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + ' years ago';
            
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + ' months ago';
            
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + ' days ago';
            
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + ' hours ago';
            
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + ' minutes ago';
            
            return Math.floor(seconds) + ' seconds ago';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    })();
</script>

{% endblock %}
