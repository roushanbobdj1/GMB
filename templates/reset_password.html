<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            padding: 48px 44px;
            width: 100%;
            max-width: 460px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .lock-icon-wrap {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #0f3460, #16213e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(15, 52, 96, 0.35);
        }

        .lock-icon-wrap i {
            font-size: 1.8rem;
            color: white;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 6px;
        }

        .card-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.88rem;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #333;
            margin-bottom: 6px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 6px;
        }

        .input-group-custom .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 0.95rem;
            z-index: 2;
        }

        .input-group-custom input {
            padding-left: 40px;
            padding-right: 44px;
            height: 52px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            font-size: 0.95rem;
            transition: border 0.25s, box-shadow 0.25s;
            width: 100%;
        }

        .input-group-custom input:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 4px rgba(15, 52, 96, 0.1);
            outline: none;
        }

        .input-group-custom input.is-valid {
            border-color: #28a745;
        }

        .input-group-custom input.is-invalid {
            border-color: #dc3545;
        }

        .toggle-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            font-size: 0.95rem;
            z-index: 2;
            transition: color 0.2s;
        }

        .toggle-eye:hover { color: #0f3460; }

        .hint-text {
            font-size: 0.78rem;
            color: #999;
            margin-top: 4px;
        }

        /* Strength Bar */
        .strength-wrap {
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .strength-bar {
            height: 5px;
            border-radius: 50px;
            background: #e9ecef;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 50px;
            width: 0%;
            transition: width 0.4s, background 0.4s;
        }

        .strength-label {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Match indicator */
        .match-indicator {
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 4px;
            min-height: 18px;
        }

        /* Submit Button */
        .btn-reset {
            background: linear-gradient(135deg, #0f3460, #16213e);
            color: white;
            border: none;
            border-radius: 12px;
            height: 52px;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            margin-top: 8px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            cursor: pointer;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 52, 96, 0.35);
            opacity: 0.92;
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        .btn-reset:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 18px;
            color: #ccc;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .back-link {
            text-align: center;
            font-size: 0.88rem;
            color: #6c757d;
        }

        .back-link a {
            color: #0f3460;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #16213e;
            text-decoration: underline;
        }

        /* Alert */
        .alert {
            border-radius: 12px;
            font-size: 0.88rem;
            border: none;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .alert-danger { background: #fff0f0; color: #c0392b; }
        .alert-success { background: #f0fff4; color: #1e7e34; }

        /* Requirements checklist */
        .req-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .req-list li {
            font-size: 0.76rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }

        .req-list li.met {
            color: #28a745;
        }

        .req-list li i {
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

<div class="glass-card">

    <!-- Icon -->
    <div class="lock-icon-wrap">
        <i class="fas fa-lock"></i>
    </div>

    <!-- Title -->
    <h2 class="card-title">Set New Password</h2>
    <p class="card-subtitle">Create a strong password to secure your account</p>

    <!-- Alert (demo) -->
    <div class="alert alert-danger alert-dismissible fade show d-none" id="demoAlert">
        Passwords do not match. Please try again.
        <button type="button" class="btn-close" onclick="this.parentElement.classList.add('d-none')"></button>
    </div>

    <!-- Form -->
    <form id="resetForm" onsubmit="handleSubmit(event)">

        <!-- New Password -->
        <div class="mb-3">
            <label class="form-label">
                <i class="fas fa-key me-1 text-secondary"></i> New Password
            </label>
            <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input
                    type="password"
                    id="newPassword"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                    minlength="8"
                    oninput="checkStrength(); checkMatch();"
                >
                <i class="fas fa-eye toggle-eye" id="toggleNew" onclick="togglePass('newPassword','toggleNew')"></i>
            </div>

            <!-- Strength Bar -->
            <div class="strength-wrap">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <!-- Requirements -->
            <ul class="req-list" id="reqList">
                <li id="req-len"><i class="fas fa-circle"></i> Min 8 characters</li>
                <li id="req-upper"><i class="fas fa-circle"></i> Uppercase letter</li>
                <li id="req-num"><i class="fas fa-circle"></i> Number</li>
                <li id="req-special"><i class="fas fa-circle"></i> Special character</li>
            </ul>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
            <label class="form-label">
                <i class="fas fa-shield-alt me-1 text-secondary"></i> Confirm Password
            </label>
            <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                    oninput="checkMatch()"
                >
                <i class="fas fa-eye toggle-eye" id="toggleConfirm" onclick="togglePass('confirmPassword','toggleConfirm')"></i>
            </div>
            <div class="match-indicator" id="matchIndicator"></div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-reset" id="submitBtn" disabled>
            <i class="fas fa-check-circle me-2"></i> Reset Password
        </button>
    </form>

    <!-- Divider -->
    <div class="divider">or</div>

    <!-- Back Link -->
    <p class="back-link">
        <i class="fas fa-arrow-left me-1"></i>
        <a href="#">Request another reset link</a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePass(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    function checkStrength() {
        const val    = document.getElementById('newPassword').value;
        const fill   = document.getElementById('strengthFill');
        const label  = document.getElementById('strengthLabel');

        const hasLen     = val.length >= 8;
        const hasUpper   = /[A-Z]/.test(val);
        const hasNum     = /[0-9]/.test(val);
        const hasSpecial = /[^A-Za-z0-9]/.test(val);

        // Update requirement items
        toggleReq('req-len',     hasLen);
        toggleReq('req-upper',   hasUpper);
        toggleReq('req-num',     hasNum);
        toggleReq('req-special', hasSpecial);

        const score = [hasLen, hasUpper, hasNum, hasSpecial].filter(Boolean).length;

        const levels = [
            { w: '0%',   color: '',          text: '',           cls: '' },
            { w: '25%',  color: '#dc3545',   text: 'Weak',       cls: 'text-danger' },
            { w: '50%',  color: '#fd7e14',   text: 'Fair',       cls: 'text-warning' },
            { w: '75%',  color: '#ffc107',   text: 'Good',       cls: 'text-warning' },
            { w: '100%', color: '#28a745',   text: 'Strong 💪',  cls: 'text-success' },
        ];

        const lvl = levels[score];
        fill.style.width      = lvl.w;
        fill.style.background = lvl.color;
        label.textContent     = lvl.text;
        label.className       = 'strength-label ' + lvl.cls;

        checkSubmit();
    }

    function toggleReq(id, met) {
        const el = document.getElementById(id);
        if (met) {
            el.classList.add('met');
            el.querySelector('i').className = 'fas fa-check-circle';
        } else {
            el.classList.remove('met');
            el.querySelector('i').className = 'fas fa-circle';
        }
    }

    function checkMatch() {
        const p1  = document.getElementById('newPassword').value;
        const p2  = document.getElementById('confirmPassword').value;
        const ind = document.getElementById('matchIndicator');
        const c   = document.getElementById('confirmPassword');

        if (!p2) {
            ind.textContent = '';
            c.classList.remove('is-valid', 'is-invalid');
        } else if (p1 === p2) {
            ind.innerHTML   = '<span class="text-success"><i class="fas fa-check-circle me-1"></i>Passwords match</span>';
            c.classList.add('is-valid');
            c.classList.remove('is-invalid');
        } else {
            ind.innerHTML   = '<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Passwords do not match</span>';
            c.classList.add('is-invalid');
            c.classList.remove('is-valid');
        }

        checkSubmit();
    }

    function checkSubmit() {
        const p1    = document.getElementById('newPassword').value;
        const p2    = document.getElementById('confirmPassword').value;
        const btn   = document.getElementById('submitBtn');
        const valid = p1.length >= 8 && p1 === p2;
        btn.disabled = !valid;
    }

    function handleSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Resetting...';
        btn.disabled  = true;

        // Simulate API call
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-check-circle me-2"></i> Password Reset!';
            btn.style.background = 'linear-gradient(135deg, #28a745, #20c997)';
        }, 1800);
    }
</script>
</body>
</html>
