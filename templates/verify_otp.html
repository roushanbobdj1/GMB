<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP - GMB Earn</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#1e293b;
    padding:40px 30px;
    border-radius:15px;
    width:90%;
    max-width:400px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.logo{
    font-size:40px;
    margin-bottom:20px;
}

h2{
    margin:0 0 10px 0;
    font-size:24px;
    font-weight:600;
}

.subtitle{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:30px;
}

.otp-box{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:25px 0;
}

.otp-box input{
    width:45px;
    height:50px;
    text-align:center;
    font-size:20px;
    font-weight:600;
    border-radius:10px;
    border:2px solid #334155;
    background:#0f172a;
    color:white;
    outline:none;
    transition:all 0.3s;
}

.otp-box input:focus{
    border-color:#667eea;
    box-shadow:0 0 10px rgba(102, 126, 234, 0.3);
}

.otp-box input::-webkit-outer-spin-button,
.otp-box input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:all 0.3s;
    margin-top:15px;
}

button:hover{
    background:#2563eb;
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(59, 130, 246, 0.4);
}

button:disabled{
    background:#64748b;
    cursor:not-allowed;
    transform:none;
}

.timer-section{
    margin-top:20px;
    padding:15px;
    background:#0f172a;
    border-radius:10px;
}

.timer{
    font-size:14px;
    color:#94a3b8;
    margin:0;
}

.timer span{
    color:#38bdf8;
    font-weight:600;
    font-size:16px;
}

.resend{
    margin-top:15px;
    display:none;
}

.resend-btn{
    background:#10b981;
    padding:10px 20px;
    font-size:14px;
    width:auto;
    margin:0 auto;
}

.resend-btn:hover{
    background:#059669;
}

.error-msg{
    color:#ef4444;
    font-size:12px;
    margin-top:10px;
    display:none;
}

.success-msg{
    color:#10b981;
    font-size:12px;
    margin-top:10px;
    display:none;
}
</style>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body>
    <script>
        (function () {
            var token = document.querySelector('meta[name="csrf-token"]');
            token = token ? token.getAttribute('content') : null;
            var originalFetch = window.fetch;
            window.fetch = function (input, init) {
                init = init || {};
                var method = (init.method || 'GET').toUpperCase();
                if (token && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                    init.headers = init.headers || {};
                    if (init.headers instanceof Headers) {
                        init.headers.set('X-CSRFToken', token);
                    } else {
                        init.headers['X-CSRFToken'] = token;
                    }
                }
                return originalFetch(input, init);
            };
        })();
    </script>

<div class="container">
    <div class="logo">
        <i class="fas fa-shield-alt"></i>
    </div>
    
    <h2>Verify Your Email</h2>
    <p class="subtitle">Enter the 6-digit code sent to your email</p>

    <form method="POST" onsubmit="return verifyOTP(event)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="otp-box" id="otpBox">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-input" oninput="handleOTPInput(this)">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-input" oninput="handleOTPInput(this)">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-input" oninput="handleOTPInput(this)">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-input" oninput="handleOTPInput(this)">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-input" oninput="handleOTPInput(this)">
            <input type="text" inputmode="numeric" maxlength="1" class="otp-input" oninput="handleOTPInput(this)">
        </div>

        <input type="hidden" name="otp" id="otp">

        <button type="submit" id="verifyBtn">
            <i class="fas fa-check-circle"></i> Verify OTP
        </button>

        <p class="error-msg" id="errorMsg"></p>
        <p class="success-msg" id="successMsg"></p>

    </form>

    <div class="timer-section">
        <p class="timer" id="timerDisplay">
            <i class="fas fa-clock"></i> Resend in <span id="timerCount">30</span>s
        </p>
        
        <div class="resend" id="resendSection">
            <button type="button" class="resend-btn" onclick="resendOTP(event)">
                <i class="fas fa-redo"></i> Resend OTP
            </button>
        </div>
    </div>

</div>

<script>

let timerInterval = null;
let timeLeft = 30;

// START TIMER JAISE PAGE LOAD HO
window.addEventListener('DOMContentLoaded', function() {
    startTimer();
    // Focus first OTP input
    document.querySelector('.otp-input').focus();
});

// TIMER FUNCTION
function startTimer() {
    timeLeft = 30;
    document.getElementById('resendSection').style.display = 'none';
    document.getElementById('timerDisplay').style.display = 'block';

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(function() {
        timeLeft--;
        document.getElementById('timerCount').innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById('timerDisplay').style.display = 'none';
            document.getElementById('resendSection').style.display = 'block';
        }
    }, 1000);
}

// OTP INPUT HANDLING
function handleOTPInput(input) {
    // Sirf numbers accept karo
    input.value = input.value.replace(/[^0-9]/g, '');

    // Next input mein jump karo
    if (input.value.length === 1) {
        const nextInput = input.nextElementSibling;
        if (nextInput && nextInput.classList.contains('otp-input')) {
            nextInput.focus();
        }
    }

    // Backspace handling
    if (input.value === '') {
        const prevInput = input.previousElementSibling;
        if (prevInput && prevInput.classList.contains('otp-input')) {
            prevInput.focus();
        }
    }
}

// COMBINE 6 DIGITS INTO ONE STRING
function combineOTP() {
    const inputs = document.querySelectorAll('.otp-input');
    let otp = '';
    
    inputs.forEach(input => {
        otp += input.value;
    });

    if (otp.length !== 6) {
        showError('Please enter all 6 digits');
        return false;
    }

    document.getElementById('otp').value = otp;
    return true;
}

// VERIFY OTP FUNCTION
function verifyOTP(event) {
    event.preventDefault();
    
    const inputs = document.querySelectorAll('.otp-input');
    let otp = '';
    
    inputs.forEach(input => {
        otp += input.value;
    });

    if (otp.length !== 6) {
        showError('Please enter all 6 digits');
        return false;
    }

    const form = event.target;
    const verifyBtn = document.getElementById('verifyBtn');
    
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

    form.submit();
    return false;
}

// RESEND OTP
function resendOTP(event) {
    const resendBtn = event.target;
    resendBtn.disabled = true;
    resendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

    fetch('/resend-otp')
        .then(response => response.json())   // 🔥 IMPORTANT
        .then(data => {
            showSuccess('✅ OTP resent successfully!');
            startTimer();

            document.querySelectorAll('.otp-input').forEach(input => input.value = '');
            document.querySelector('.otp-input').focus();

            resendBtn.disabled = false;
            resendBtn.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
        })
        .catch(error => {
            showError('Error resending OTP');
            resendBtn.disabled = false;
            resendBtn.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
        });
}

function showError(message) {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = message;
    errorMsg.style.display = 'block';
    setTimeout(() => {
        errorMsg.style.display = 'none';
    }, 4000);
}

function showSuccess(message) {
    const successMsg = document.getElementById('successMsg');
    successMsg.innerText = message;
    successMsg.style.display = 'block';
    setTimeout(() => {
        successMsg.style.display = 'none';
    }, 4000);
}

// KEYBOARD SUPPORT - ENTER TO SUBMIT
document.addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
        const allFilled = Array.from(document.querySelectorAll('.otp-input')).every(input => input.value.length === 1);
        if (allFilled) {
            verifyOTP(event);
        }
    }
});

</script>

</body>
</html>
