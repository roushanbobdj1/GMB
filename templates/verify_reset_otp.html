{% extends "base.html" %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        font-family: 'Poppins', sans-serif;
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        width: 100%;
        max-width: 420px;
        padding: 30px;
        animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .login-title {
        font-weight: 600;
        text-align: center;
        margin-bottom: 25px;
        color: #1e293b;
    }

    .form-label {
        font-weight: 500;
        color: #334155;
    }

    .otp-box {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .otp-box input {
        width: 100%;
        height: 50px;
        text-align: center;
        font-size: 18px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        transition: 0.3s;
    }

    .otp-box input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        outline: none;
    }

    .btn-primary {
        background: #2563eb;
        border: none;
        border-radius: 10px;
        height: 45px;
        font-weight: 500;
        transition: 0.3s;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .login-footer {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }

    .login-footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }

    .login-footer a:hover {
        text-decoration: underline;
    }

    .timer {
        text-align: center;
        font-size: 13px;
        margin-top: 10px;
        color: #64748b;
    }

    @media (max-width: 576px) {
        .login-card {
            padding: 20px;
        }
    }
</style>

<div class="login-container">
    <div class="login-card">

        <h3 class="login-title">
            <i class="fas fa-shield-alt"></i> Verify OTP
        </h3>

        <form method="POST" onsubmit="return combineOTP()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- OTP BOX -->
            <div class="mb-3">
                <label class="form-label">Enter OTP</label>

                <div class="otp-box">
                    <input type="text" maxlength="1" oninput="moveNext(this,0)">
                    <input type="text" maxlength="1" oninput="moveNext(this,1)">
                    <input type="text" maxlength="1" oninput="moveNext(this,2)">
                    <input type="text" maxlength="1" oninput="moveNext(this,3)">
                    <input type="text" maxlength="1" oninput="moveNext(this,4)">
                    <input type="text" maxlength="1" oninput="moveNext(this,5)">
                </div>

                <!-- Hidden OTP -->
                <input type="hidden" name="otp" id="otp">
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-check-circle"></i> Verify OTP
            </button>

        </form>

        <div class="timer" id="timer">Resend available in 60s</div>

        <div class="login-footer">
            <a href="/forgot-password">Resend OTP</a>
        </div>

    </div>
</div>

<script>
function moveNext(input, index){
    if(input.value.length === 1){
        let next = input.parentElement.children[index + 1];
        if(next) next.focus();
    }
}

// Combine OTP
function combineOTP(){
    let inputs = document.querySelectorAll(".otp-box input");
    let otp = "";

    for(let input of inputs){
        if(input.value === ""){
            alert("Please enter complete OTP");
            return false;
        }
        otp += input.value;
    }

    document.getElementById("otp").value = otp;
    return true;
}

// Timer
let time = 60;
let timer = document.getElementById("timer");

let countdown = setInterval(() => {
    time--;
    timer.innerText = "Resend available in " + time + "s";

    if(time <= 0){
        clearInterval(countdown);
        timer.innerText = "You can resend OTP now";
    }
}, 1000);
</script>

{% endblock %}
